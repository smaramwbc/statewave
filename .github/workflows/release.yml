name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Packages version independently per repo; the cross-repo compatibility axis
  # is the /v1 API contract, not a shared number (smaramwbc/statewave#106).
  # This gate therefore only verifies the SERVER / reference-impl version is
  # self-consistent across its own surfaces + conceptual-doc banners. It does
  # NOT assert SDK-package-number equality — check-versions.py reports
  # independently-versioned surfaces without failing.
  verify-workspace-versions:
    name: Verify server/contract version self-consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out statewave
        uses: actions/checkout@v7
        with:
          path: statewave

      - name: Check out statewave-py
        uses: actions/checkout@v7
        with:
          repository: smaramwbc/statewave-py
          path: statewave-py

      - name: Check out statewave-ts
        uses: actions/checkout@v7
        with:
          repository: smaramwbc/statewave-ts
          path: statewave-ts

      - name: Check out statewave-docs
        uses: actions/checkout@v7
        with:
          repository: smaramwbc/statewave-docs
          path: statewave-docs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify server/contract surfaces match statewave/pyproject.toml
        run: python statewave-docs/tools/check-versions.py

  # Proof figures (test counts, eval assertion/test counts, support-workflow
  # benchmark score) are hand-mirrored across docs, the core README, and the
  # marketing site. Unlike package versions they are NOT independent — they
  # must always agree. The check can't run in a single repo's PR CI because it
  # reads sibling repos, so it runs here as a release-time gate (same model as
  # the version check). SSoT + targets live in statewave-docs/tools.
  verify-proof-figures:
    name: Verify proof-figure consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out statewave
        uses: actions/checkout@v7
        with:
          path: statewave

      - name: Check out statewave-docs
        uses: actions/checkout@v7
        with:
          repository: smaramwbc/statewave-docs
          path: statewave-docs

      - name: Check out statewave-web
        uses: actions/checkout@v7
        with:
          repository: smaramwbc/statewave-web
          path: statewave-web

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify proof-figure mirrors match the single source of truth
        run: python statewave-docs/tools/check-proof-figures.py

  release:
    runs-on: ubuntu-latest
    needs: [verify-workspace-versions, verify-proof-figures]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
