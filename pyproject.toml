[project]
name = "statewave"
version = "1.4.0"
description = "Open-source memory runtime for AI agents — durable, structured context with provenance."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.1,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31.0,<1",
    "alembic>=1.18.5,<2",
    "pgvector>=0.5.0,<1",
    # Used directly by the conflict-detection and clustering admin endpoints.
    # It used to arrive transitively via pgvector, but pgvector 0.5.0 dropped
    # the dependency, so it has to be declared explicitly.
    "numpy>=1.26,<3",
    "tiktoken>=0.13.0,<1",
    "structlog>=26.1.0,<27",
    "pyyaml>=6.0.3,<7",
    # Used directly by webhook delivery. It happened to be installed via the
    # `llm` extra's dependency graph, so a core-only install had no httpx and
    # webhook delivery raised ModuleNotFoundError.
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.1,<1",
    "ruff>=0.16.1,<0.17",
]
llm = [
    "litellm>=1.94.0,<2",
]
otel = [
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp>=1.44.0,<2",
]

[project.urls]
Homepage = "https://statewave.ai"
Repository = "https://github.com/smaramwbc/statewave"
Issues = "https://github.com/smaramwbc/statewave/issues"
Documentation = "https://github.com/smaramwbc/statewave-docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's defaults, which
# change between releases: 0.16 widened the default selection from 59 rules to
# 413 and turned a routine version bump into 460 lint errors. These four
# prefixes are exactly what ruff enforced by default through 0.15, so this
# records the rules we already meet rather than changing the lint contract.
# Widening the selection is tracked separately in #314.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "smoke: live-stack smoke tests (require docker compose; see make test-cold)",
]
